# Render Blueprint Specification for JanSetu AI FastAPI Backend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: jansetu-ai-api
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      # Sensitive & Hosted Configurations (Enter securely in Render Dashboard)
      - key: DATABASE_URL
        sync: false # PostgreSQL connection string from Supabase (Transaction Pooler: port 6543)
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "300"
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false # https://<project-ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Supabase service_role secret key (Backend only)
      - key: SUPABASE_STORAGE_BUCKET
        value: jansetu-evidence
      - key: SUPABASE_SIGNED_URL_EXPIRY_SECONDS
        value: "900"
      - key: GROQ_API_KEY
        sync: false # Groq API secret key
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Comma-separated: https://jansetu-ai.vercel.app,https://<your-streamlit-app>.streamlit.app
      - key: DEMO_MODE
        value: "true"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
