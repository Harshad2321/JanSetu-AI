services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jansetu-backend-prod
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEMO_MODE=true
      - DATABASE_URL=sqlite:///./data/jansetu.db
      - STORAGE_DIR=./data/uploads
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
    volumes:
      - jansetu_data:/app/data
      - jansetu_eval:/app/eval
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jansetu_internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: jansetu-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jansetu_internal

networks:
  jansetu_internal:
    driver: bridge

volumes:
  jansetu_data:
    name: jansetu_production_data
  jansetu_eval:
    name: jansetu_production_eval
